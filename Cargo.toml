[package]
name = "geekmagic-tokens"
version = "0.1.0"
edition = "2021"

[dependencies]
embedded-graphics = "0.8"
embedded-hal = "1"
esp-idf-svc = "0.51"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
embuild = { version = "0.33", features = ["espidf"] }

[profile.release]
opt-level = "s"
